# Orquestacion local de los 6 microservicios de negocio de Voltera + Service Registry.
# Orden de negocio: Tarifas -> Volumetria -> Liquidacion P2P (tiempo real) ->
# Liquidacion Mensual (totaliza) -> Facturacion (factura mensual) -> Pagos.
# Cada contenedor tiene un limite de memoria acotado para simular el pod que
# comparte 5GB con observabilidad y el sidecar del service mesh.
services:

  service-registry:
    build: ./service-registry
    container_name: voltera-registry
    ports:
      - "8761:8761"
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # [1] Crea el precio
  tarifas-service:
    build: ./ServiciosDeNegocio/tarifas-service
    container_name: voltera-tarifas
    ports:
      - "8084:8084"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # [2] Ingesta lecturas (consumo/generacion)
  volumetria-service:
    build: ./ServiciosDeNegocio/volumetria-service
    container_name: voltera-volumetria
    ports:
      - "8083:8083"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # [3] Liquidacion P2P en tiempo real (empareja y conoce el costo)
  liquidacion-p2p-service:
    build: ./ServiciosDeNegocio/liquidacion-p2p-service
    container_name: voltera-liquidacion-p2p
    ports:
      - "8081:8081"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # [4] Liquidacion Mensual (totaliza excedentes y consumos)
  liquidacion-mensual-service:
    build: ./ServiciosDeNegocio/liquidacion-mensual-service
    container_name: voltera-liquidacion-mensual
    ports:
      - "8082:8082"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # [5] Facturacion (genera la factura mensual)
  facturacion-service:
    build: ./ServiciosDeNegocio/facturacion-service
    container_name: voltera-facturacion
    ports:
      - "8088:8088"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # [6] Pagos (cobra usando la referencia de la factura)
  pagos-service:
    build: ./ServiciosDeNegocio/pagos-service
    container_name: voltera-pagos
    ports:
      - "8085:8085"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
