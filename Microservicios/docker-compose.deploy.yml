      - "8093:8093"
    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    depends_on:
      service-registry:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  tarifa-eventos-service:
    image: 192.168.3.13/app-voltaire/tarifa-eventos-service:1.0.0
    container_name: voltera-tarifa-eventos
    restart: unless-stopped
    ports:
      - "8094:8094"
