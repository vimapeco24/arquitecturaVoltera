    environment:
      - EUREKA_ENABLED=true
      - EUREKA_URL=http://service-registry:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    depends_on:
      service-registry:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # Caso Telemetria (EDA): telemetria-service (emisor IoT) + tarifa-eventos
  # --------------------------------------------------------------------------
  telemetria-service:
    image: 192.168.3.13/app-voltaire/telemetria-service:1.0.0
    container_name: voltera-telemetria
    restart: unless-stopped
