# ---------------------------------------------------------------------------
# TELEMETRIA-CORE (8098) — CQRS; consume telemetria-lecturas-validadas,
# publica telemetria-consumo-intervalos + telemetria-alertas.
# Persistencia completa: redis + tsdb + inbox-jdbc.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetria-core-service
  namespace: voltera-app
  labels: { app: telemetria-core-service }
spec:
  replicas: 2            # min 2
  selector: { matchLabels: { app: telemetria-core-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
  template:
    metadata: { labels: { app: telemetria-core-service, version: v1 } }
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: telemetria-core-service
          image: 192.168.3.13/app-voltaire/telemetria-core-service:1.0.0
          ports: [{ containerPort: 8098 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "redpanda.voltera-app:9092" }
            - { name: SPRING_PROFILES_ACTIVE, value: "redis,tsdb,inbox-jdbc" }
            - { name: REDIS_HOST, value: "redis.voltera-app" }
            - { name: REDIS_PORT, value: "6379" }
            - { name: TSDB_URL, value: "jdbc:postgresql://timescaledb.voltera-app:5432/voltera_tsdb" }
            - { name: TSDB_USER, value: "voltera" }
            - { name: TSDB_PASSWORD, valueFrom: { secretKeyRef: { name: timescaledb-cred, key: POSTGRES_PASSWORD } } }
            - { name: INBOX_URL, value: "jdbc:postgresql://timescaledb.voltera-app:5432/voltera_inbox" }
            - { name: INBOX_USER, value: "voltera" }
            - { name: INBOX_PASSWORD, valueFrom: { secretKeyRef: { name: timescaledb-cred, key: POSTGRES_PASSWORD } } }
          resources:
            limits: { cpu: "700m", memory: "640Mi" }
            requests: { cpu: "100m", memory: "200Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8098 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: { name: telemetria-core-service, namespace: voltera-app }
spec:
  selector: { app: telemetria-core-service }
  ports: [{ port: 8098, targetPort: 8098 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: telemetria-core-service, namespace: voltera-app }
spec:
  parentRefs: [{ name: istio-ingress, namespace: istio-ingress }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /telemetria-core } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: "" } }
      backendRefs: [{ name: telemetria-core-service, port: 8098 }]
---
