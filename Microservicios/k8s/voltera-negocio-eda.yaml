# ============================================================================
# VOLTERA — Servicios de negocio de la cadena EDA (laminas 02/03)
# ----------------------------------------------------------------------------
# Deployments que FALTABAN en el cluster y a los que apuntan los ScaledObjects
# de la lamina 04 (voltera-keda-lamina04.yaml):
#   habilitacion (8095) · integracion-ami (8096) · ingesta (8097) ·
#   telemetria-core (8098) · notificaciones (8099)
#
# (facturacion/liquidacion-mensual/tarifas ya existen en voltera-services.yaml;
#  a esos se les anade el env de perfiles con 'kubectl set env' — ver
#  voltera-persistence-env.yaml / deploy-eda-completo.sh.)
#
# Cada servicio trae el env de PERSISTENCIA ya cableado:
#   - todos: perfil inbox-jdbc (idempotencia en voltera_inbox)
#   - telemetria-core: ademas redis + tsdb
# Requiere: redpanda (voltera-eda.yaml) y persistencia (voltera-persistence.yaml).
#
# Aplicar:  kubectl apply -f voltera-negocio-eda.yaml
# ============================================================================

# Bloque reutilizable de env de persistencia (anclas YAML).
# NOTA: las anclas valen dentro de ESTE archivo; se repiten por claridad.

# ---------------------------------------------------------------------------
# HABILITACION (8095) — mediador del alta; consume ordenes-instalacion
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habilitacion-service
  namespace: voltera-app
  labels: { app: habilitacion-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: habilitacion-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
  template:
    metadata: { labels: { app: habilitacion-service, version: v1 } }
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: habilitacion-service
          image: 192.168.3.13/app-voltaire/habilitacion-service:1.0.0
          ports: [{ containerPort: 8095 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "redpanda.voltera-app:9092" }
            - { name: SPRING_PROFILES_ACTIVE, value: "inbox-jdbc" }
            - { name: INBOX_URL, value: "jdbc:postgresql://timescaledb.voltera-app:5432/voltera_inbox" }
            - { name: INBOX_USER, value: "voltera" }
            - { name: INBOX_PASSWORD, valueFrom: { secretKeyRef: { name: timescaledb-cred, key: POSTGRES_PASSWORD } } }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }
            requests: { cpu: "50m", memory: "160Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8095 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: { name: habilitacion-service, namespace: voltera-app }
spec:
  selector: { app: habilitacion-service }
  ports: [{ port: 8095, targetPort: 8095 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: habilitacion-service, namespace: voltera-app }
spec:
  parentRefs: [{ name: istio-ingress, namespace: istio-ingress }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /habilitacion } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: "" } }
      backendRefs: [{ name: habilitacion-service, port: 8095 }]
---
