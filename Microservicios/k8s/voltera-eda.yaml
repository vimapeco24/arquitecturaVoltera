# ============================================================================
# e) EVENT MESH — Expansión multi-región
# ----------------------------------------------------------------------------
# Para la expansión de Voltera a México, Chile y Perú, los eventos
# (SiniestroAprobado, etc.) deben cruzar regiones sin acoplar servicios.
#
# Un event mesh (ej. Solace PubSub+, Confluent Cluster Linking, o
# Redpanda con cross-cluster replication) interconecta los brokers
# regionales. Cada región tiene su broker local; el mesh replica los
# topics entre regiones de forma transparente.
#
# Topología:
#   Colombia (Synology)  <-->  México (cloud)  <-->  Chile (cloud)
#          \                                        /
#           <----------->  Perú (cloud)  <-------->
#
# El productor publica en su broker local; el mesh garantiza que los
# consumidores de cualquier región reciban el evento. Zero Trust: cada
# región define qué topics puede publicar/suscribir (ACLs por principal).
# ============================================================================
