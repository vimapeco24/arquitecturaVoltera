# ============================================================================
# VOLTERA — ENTREGA 3 (EDA: Event-Driven Architecture)
# ----------------------------------------------------------------------------
# Contiene TODO lo relacionado con la arquitectura orientada a eventos:
#   a) Redpanda        -> broker compatible Kafka (single-node, demo)
#   b) siniestros-service (8091) -> productor del evento SiniestroAprobado
#   c) reaseguro-service  (8092) -> consumidor del topic siniestro-aprobado
#   d) KEDA ScaledObject -> autoescala reaseguro por lag del consumer group
#   e) Event Mesh (bloque conceptual comentado) -> expansión multi-región
#
# Aplicar:  kubectl apply -f voltera-eda.yaml
# ============================================================================

# ============================================================================
# a) REDPANDA — broker compatible Kafka, bajo consumo de RAM (~200MB)
# ----------------------------------------------------------------------------
# Single-node para demo académica. Expone el protocolo Kafka en :9092.
# El advertise-kafka-addr usa el DNS del Service (redpanda.voltera-app) para
# que los clientes dentro del cluster resuelvan correctamente el broker.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: voltera-app
  labels: { app: redpanda }
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
          args:
            - redpanda
            - start
            - --smp 1
            - --memory 200M
            - --reserve-memory 0M
            - --overprovisioned
            - --node-id 0
            - --kafka-addr PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr PLAINTEXT://redpanda.voltera-app:9092
          ports:
            - { containerPort: 9092, name: kafka }
            - { containerPort: 8081, name: schema }
            - { containerPort: 9644, name: admin }
          resources:
            limits: { cpu: "500m", memory: "300Mi" }
            requests: { cpu: "100m", memory: "200Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: voltera-app
spec:
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
    - { name: schema, port: 8081, targetPort: 8081 }
    - { name: admin, port: 9644, targetPort: 9644 }
---
# ============================================================================
# b) SINIESTROS-SERVICE (8091) — productor del evento SiniestroAprobado
# ----------------------------------------------------------------------------
# Sigue el mismo patrón que los servicios de voltera-services.yaml.
# Al aprobar un siniestro publica el evento en el topic 'siniestro-aprobado'.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siniestros-service
  namespace: voltera-app
  labels: { app: siniestros-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: siniestros-service } }
  # maxSurge=0: el worker tiene poca RAM y no admite un pod extra durante el
  # rollout, así que se termina el pod viejo antes de crear el nuevo.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata: { labels: { app: siniestros-service, version: v1 } }   # version -> Kiali/telemetria
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: siniestros-service
          image: 192.168.3.13/app-voltaire/siniestros-service:1.0.0
          ports: [{ containerPort: 8091 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "redpanda.voltera-app:9092" }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }        # cpu limit para acotar el pod
            requests: { cpu: "50m", memory: "160Mi" }       # cpu request -> BASE del calculo del HPA
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8091 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: siniestros-service
  namespace: voltera-app
spec:
  selector: { app: siniestros-service }
  ports: [{ port: 8091, targetPort: 8091 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: siniestros-service
  namespace: voltera-app
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /siniestros }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: "" }
      backendRefs:
        - name: siniestros-service
          port: 8091
---
