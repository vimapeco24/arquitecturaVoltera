# ============================================================================
# d) KEDA ScaledObject — autoescalado dirigido por eventos (event-driven)
# ----------------------------------------------------------------------------
# KEDA escala reaseguro-service según el LAG del consumer group
# 'reaseguro-consumer' en el topic 'siniestro-aprobado'.
#
# REQUISITO: KEDA debe estar instalado en el cluster:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm repo update
#   helm install keda kedacore/keda --namespace keda --create-namespace
#
# Sin KEDA instalado, este recurso simplemente NO se aplica (el CRD
# keda.sh/v1alpha1 no existe) pero el resto del manifiesto funciona igual;
# reaseguro-service seguiría con su replica fija (replicas: 1).
# ============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reaseguro-scaledobject
  namespace: voltera-app
spec:
  scaleTargetRef:
    name: reaseguro-service
  pollingInterval: 10
  cooldownPeriod: 30
  minReplicaCount: 0    # scale to zero cuando no hay eventos
  maxReplicaCount: 5
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: redpanda.voltera-app:9092
        consumerGroup: reaseguro-consumer
        topic: siniestro-aprobado
        lagThreshold: "10"     # umbral: >10 mensajes pendientes -> escala
---
# ============================================================================
# CASO TELEMETRIA (EDA) — telemetria-service + tarifa-eventos-service
# ----------------------------------------------------------------------------
# telemetria-service (8093): emisor IoT. Ingesta consumo de prosumidores con
#   procesamiento offline (store-and-forward) y publica el evento
#   ConsumoRegistrado en el topic 'consumo-registrado'.
# tarifa-eventos-service (8094): consumidor CQRS. Consume 'consumo-registrado',
#   calcula el cargo por consumo extra y proyecta a la vista de lectura.
#   KEDA lo autoescala por el lag del consumer group 'tarifa-eventos-consumer'.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetria-service
  namespace: voltera-app
  labels: { app: telemetria-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: telemetria-service } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata: { labels: { app: telemetria-service, version: v1 } }
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: telemetria-service
          image: 192.168.3.13/app-voltaire/telemetria-service:1.0.0
          ports: [{ containerPort: 8093 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "redpanda.voltera-app:9092" }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }
            requests: { cpu: "50m", memory: "160Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8093 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: telemetria-service
  namespace: voltera-app
spec:
  selector: { app: telemetria-service }
  ports: [{ port: 8093, targetPort: 8093 }]
---
apiVersion: gateway.networking.k8s.io/v1
