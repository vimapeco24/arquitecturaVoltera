---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facturacion-service
  namespace: voltera-app
  labels: { app: facturacion-service }
spec:
  replicas: 2                                   # HA: 2 replicas base (el HPA ajusta entre min/max)
  selector: { matchLabels: { app: facturacion-service } }
  template:
    metadata: { labels: { app: facturacion-service, version: v1 } }   # version -> Kiali/telemetria
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: facturacion-service
          image: 192.168.3.13/app-voltaire/facturacion-service:1.0.1
          ports: [{ containerPort: 8088 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }        # cpu limit para acotar el pod
            requests: { cpu: "50m", memory: "160Mi" }       # cpu request -> BASE del calculo del HPA
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8088 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: facturacion-service
  namespace: voltera-app
spec:
  selector: { app: facturacion-service }
  ports: [{ port: 8088, targetPort: 8088 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: facturacion-service
  namespace: voltera-app
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /facturacion }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: "" }
      backendRefs:
        - name: facturacion-service
          port: 8088
