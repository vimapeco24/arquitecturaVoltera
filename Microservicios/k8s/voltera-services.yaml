apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos-service
  namespace: voltera-app
  labels: { app: pagos-service }
spec:
  replicas: 2                                   # HA: 2 replicas base (el HPA ajusta entre min/max)
  selector: { matchLabels: { app: pagos-service } }
  # maxSurge=0: el worker tiene poca RAM y no admite un pod extra durante el rollout,
  # así que se termina el pod viejo antes de crear el nuevo (evita quedar Pending).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata: { labels: { app: pagos-service, version: v1 } }   # version -> Kiali/telemetria
    spec:
      imagePullSecrets: [{ name: harbor-cred }]
      containers:
        - name: pagos-service
          image: 192.168.3.13/app-voltaire/pagos-service:1.0.1
          ports: [{ containerPort: 8085 }]
          env:
            - { name: EUREKA_ENABLED, value: "true" }
            - { name: EUREKA_URL, value: "http://service-registry:8761/eureka/" }
          resources:
            limits: { cpu: "500m", memory: "512Mi" }        # cpu limit para acotar el pod
            requests: { cpu: "50m", memory: "160Mi" }       # cpu request -> BASE del calculo del HPA
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: pagos-service
  namespace: voltera-app
spec:
  selector: { app: pagos-service }
  ports: [{ port: 8085, targetPort: 8085 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pagos-service
  namespace: voltera-app
spec:
  parentRefs:
    - name: istio-ingress
      namespace: istio-ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /pagos }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: "" }
      backendRefs:
        - name: pagos-service
          port: 8085
