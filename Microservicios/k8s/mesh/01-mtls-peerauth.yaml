# ============================================================================
# Voltera - Service Mesh (Istio) | Paso 1: mTLS ESTRICTO entre microservicios
# ----------------------------------------------------------------------------
# PeerAuthentication en modo STRICT obliga a que TODO el trafico entre pods del
# namespace voltera-app viaje cifrado y mutuamente autenticado (mTLS) por los
# sidecars Envoy. Trafico en texto plano se RECHAZA.
#
# Esto es exactamente el "mTLS entre los micros" que acordaron demostrar.
#
# NOTAS:
#  - Las probes de readiness/liveness siguen funcionando: Istio reescribe las
#    HTTP probes del kubelet (rewriteAppHTTPProbe, activo por defecto).
#  - El Gateway de ingress (istio-ingress) pertenece a la malla, asi que
#    tambien habla mTLS hacia los servicios.
#  - Si algun cliente externo NO sidecar necesitara entrar en texto plano a un
#    puerto concreto, se usaria PERMISSIVE en ese puerto. Aqui vamos STRICT
#    (postura que evalua el profesor).
#
# Verificar el modo efectivo:
#   istioctl authn tls-check <pod>.<ns> | grep voltera
#   kubectl -n voltera-app get peerauthentication
# ============================================================================
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: voltera-mtls-strict
  namespace: voltera-app
spec:
  mtls:
    mode: STRICT
