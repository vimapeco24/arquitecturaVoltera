server:
  port: 8095
  tomcat:
    threads:
      max: 25
      min-spare: 5

spring:
  application:
    name: habilitacion-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda.voltera-app:9092}
    consumer:
      group-id: habilitacion-consumer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Patron Orquestacion (mediador): timeout del alta y relay del outbox.
habilitacion:
  alta:
    timeout-min: ${ALTA_TIMEOUT_MIN:15}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:3000}
  timeout:
    check-interval-ms: ${TIMEOUT_CHECK_INTERVAL_MS:5000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
