server:
  port: 8094
  tomcat:
    threads:
      max: 25
      min-spare: 5
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: tarifa-eventos-service
  main:
    lazy-initialization: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda.voltera-app:9092}
    consumer:
      group-id: tarifa-eventos-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    enable:
      all: false
      jvm: true
      http: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
---
# Inbox persistente (lamina 10). Activar con SPRING_PROFILES_ACTIVE=inbox-jdbc.
# Sin este perfil, el inbox es in-memory y no se requiere base de datos.
spring:
  config:
    activate:
      on-profile: inbox-jdbc
inbox:
  datasource:
    url: ${INBOX_URL:jdbc:postgresql://localhost:5432/voltera_inbox}
    username: ${INBOX_USER:voltera}
    password: ${INBOX_PASSWORD:voltera}
