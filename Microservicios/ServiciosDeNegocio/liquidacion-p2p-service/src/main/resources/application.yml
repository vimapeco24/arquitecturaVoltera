server:
  port: 8081
  tomcat:
    threads:
      max: 25
      min-spare: 5
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: liquidacion-p2p-service
  main:
    lazy-initialization: true
  threads:
    virtual:
      enabled: true

# Conexion opcional al blockchain-gateway (vacio = deshabilitado / no-op).
# Apunta a la URL publica de la PaaS (Fly/Render/Railway) o a la ruta WSO2.
#   ej. https://voltera-blockchain-gateway.fly.dev
#   ej. https://192.168.3.13:8243/blockchain/v1
voltera:
  blockchain:
    gateway-url: ${VOLTERA_BLOCKCHAIN_GATEWAY_URL:}
    anclar-path: ${VOLTERA_BLOCKCHAIN_ANCLAR_PATH:/api/v1/anclajes}
  # EDA: publicar LiquidacionCalculada al casar (cierra la orquestación por
  # eventos con el blockchain-gateway). false por defecto; true en el clúster
  # (donde existe el broker Redpanda). En Render se deja en false (broker LAN).
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  eventos:
    topic-liquidacion: ${VOLTERA_TOPIC_LIQUIDACION:topic.facturacion.liquidacion}

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:redpanda.voltera-app:9092}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    enable:
      all: false
      jvm: true
      http: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
