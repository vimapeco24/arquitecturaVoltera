server:
  port: 8098

spring:
  application:
    name: telemetria-core-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda.voltera-app:9092}
    consumer:
      group-id: telemetria-core-consumer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

telemetria-core:
  # Duracion del intervalo de agregacion (lamina: cada 15 min).
  intervalo-min: ${INTERVALO_MIN:15}
  # Si un medidor habilitado no reporta en este tiempo, se emite MedidorSinReporte.
  sin-reporte-min: ${SIN_REPORTE_MIN:30}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:3000}
  sin-reporte:
    check-interval-ms: ${SIN_REPORTE_CHECK_INTERVAL_MS:10000}

---
# Persistencia REAL por perfil (lamina 03 · CQRS). Activar con, p. ej.:
#   SPRING_PROFILES_ACTIVE=redis,tsdb
# Sin perfil, el servicio usa adaptadores in-memory y no requiere Redis ni BD.
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

---
spring:
  config:
    activate:
      on-profile: tsdb
  datasource:
    url: ${TSDB_URL:jdbc:postgresql://localhost:5432/voltera_tsdb}
    username: ${TSDB_USER:voltera}
    password: ${TSDB_PASSWORD:voltera}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
