server:
  port: ${PORT:8104}
  tomcat:
    threads:
      max: 25
      min-spare: 5
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: ia-service
  main:
    lazy-initialization: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda.voltera-app:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# -----------------------------------------------------------------------------
# Modo de despliegue del broker. El servidor on-premise esta saturado, asi que
# este servicio corre del lado de la NUBE (PaaS, p. ej. Render) junto al
# frontend (Vercel) y al blockchain-gateway (Render). En la nube el broker
# Redpanda vive en la LAN privada del clúster y NO es alcanzable, por eso Kafka
# va DESHABILITADO por defecto (voltera.kafka.enabled=false) y el evento se
# registra en el log (LogEventPublisher). Para correr on-premise, poner
# voltera.kafka.enabled=true.
# -----------------------------------------------------------------------------
voltera:
  kafka:
    enabled: ${VOLTERA_KAFKA_ENABLED:false}

# -----------------------------------------------------------------------------
# Plataforma GenAI (arquitectura de referencia Arsanjani / caso Solventa).
# El Model Gateway es best-effort: si no hay proveedor configurado (provider=none
# o sin api-key), el servicio razona con el motor local heuristico y NO envia
# ningun dato fuera. Esto satisface Zero-retention y Responsible AI por defecto.
# -----------------------------------------------------------------------------
ia:
  model-gateway:
    # none | openai-compatible. Por defecto "none" para que la demo funcione
    # sin credenciales y sin sacar datos sensibles.
    provider: ${IA_PROVIDER:none}
    base-url: ${IA_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${IA_LLM_API_KEY:}
    model: ${IA_LLM_MODEL:gpt-4o-mini}
    # Presupuesto de tokens por solicitud (FinOps / budgets del gateway).
    max-tokens: ${IA_MAX_TOKENS:600}
    timeout-ms: ${IA_TIMEOUT_MS:8000}
    # Zero-retention: cabecera que pide al proveedor no retener prompts.
    zero-retention: ${IA_ZERO_RETENTION:true}
  human-in-the-loop:
    # Umbral (COP) por encima del cual la recomendacion EXIGE revision humana.
    umbral-aprobacion-humana: ${IA_UMBRAL_HUMANO:3000000}
  tools:
    # URLs base de los microservicios usados como herramientas (MCP/REST).
    # En modo NUBE: siniestros-service vive en la LAN privada y NO es alcanzable
    # (el copiloto degrada con elegancia: evidencia "no verificable"). El
    # blockchain-gateway SI es publico (Render), por eso su URL por defecto es
    # la publica; se puede sobreescribir con las variables de entorno.
    siniestros-url: ${IA_TOOL_SINIESTROS_URL:http://siniestros-service:8091}
    blockchain-url: ${IA_TOOL_BLOCKCHAIN_URL:https://voltera-blockchain-gateway.onrender.com}
    # Capa de telemetría DER (caja 3 · MCP). On-premise; en nube no alcanzable.
    telemetria-url: ${IA_TOOL_TELEMETRIA_URL:http://telemetria-core-service:8098}
    enabled: ${IA_TOOLS_ENABLED:true}
    timeout-ms: ${IA_TOOLS_TIMEOUT_MS:3000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    enable:
      all: false
      jvm: true
      http: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
