server:
  port: 8102
  tomcat:
    threads:
      max: 25
      min-spare: 5
    max-connections: 500
    accept-count: 50

spring:
  application:
    name: certificacion-generacion-service
  main:
    lazy-initialization: true
  threads:
    virtual:
      enabled: true

# Este servicio NO toca la cadena (lámina 04). Solo consume la generación de
# Telemetría y reúne avales. El tamaño del bloque certificable es configurable.
voltera:
  certificacion:
    bloque-wh: ${VOLTERA_CERT_BLOQUE_WH:1000000}   # 1 MWh = 1_000_000 Wh

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    enable:
      all: false
      jvm: true
      http: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
