server:
  port: 8099

spring:
  application:
    name: notificaciones-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda.voltera-app:9092}
    consumer:
      group-id: notificaciones-consumer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

notificaciones:
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:3000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin.istio-system:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.voltera: INFO
---
# Inbox persistente (lamina 10). Activar con SPRING_PROFILES_ACTIVE=inbox-jdbc.
# Sin este perfil, el inbox es in-memory y no se requiere base de datos.
spring:
  config:
    activate:
      on-profile: inbox-jdbc
inbox:
  datasource:
    url: ${INBOX_URL:jdbc:postgresql://localhost:5432/voltera_inbox}
    username: ${INBOX_USER:voltera}
    password: ${INBOX_PASSWORD:voltera}

---
# CQRS · Database per Service (diagrama 04 · Patrones). SPRING_PROFILES_ACTIVE=cqrs-jdbc.
spring:
  config:
    activate:
      on-profile: cqrs-jdbc
cqrs:
  write:
    url: ${CQRS_WRITE_URL:jdbc:postgresql://localhost:5432/voltera_notif_write}
    username: ${CQRS_USER:voltera}
    password: ${CQRS_PASSWORD:voltera}
  read:
    url: ${CQRS_READ_URL:jdbc:postgresql://localhost:5432/voltera_notif_read}
    username: ${CQRS_USER:voltera}
    password: ${CQRS_PASSWORD:voltera}
